name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/example/lockphone app/src/main/res/xml app/src/main/res/values
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "LockPhone"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          printf 'android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2048m\n' > gradle.properties
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.lockphone"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.lockphone"
                  minSdk = 28
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="@string/app_name" android:allowBackup="false">
                  <activity
                      android:name=".MainActivity"
                      android:theme="@android:style/Theme.Translucent.NoTitleBar"
                      android:excludeFromRecents="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".LockService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/lock_config"/>
                  </service>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/example/lockphone/LockService.kt <<'EOF'
          package com.example.lockphone

          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.view.accessibility.AccessibilityEvent

          class LockService : AccessibilityService() {
              companion object { var instance: LockService? = null }
              override fun onServiceConnected() { instance = this }
              override fun onUnbind(intent: Intent?): Boolean {
                  instance = null
                  return super.onUnbind(intent)
              }
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}
          }
          EOF
          cat > app/src/main/java/com/example/lockphone/MainActivity.kt <<'EOF'
          package com.example.lockphone

          import android.accessibilityservice.AccessibilityService
          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Toast

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val svc = LockService.instance
                  if (svc != null) {
                      svc.performGlobalAction(AccessibilityService.GLOBAL_ACTION_LOCK_SCREEN)
                  } else {
                      Toast.makeText(this, "Accessibility me Lock Phone chalu karein", Toast.LENGTH_LONG).show()
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }
                  finish()
              }
          }
          EOF
          cat > app/src/main/res/xml/lock_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityFlags="flagDefault"
              android:description="@string/service_desc" />
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Lock Phone</string>
              <string name="service_desc">Voice command se phone screen lock karne ke liye</string>
          </resources>
          EOF
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LockPhone-APK
          path: app/build/outputs/apk/debug/app-debug.apk
